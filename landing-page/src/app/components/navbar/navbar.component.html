<nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-lg shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center space-x-2 cursor-pointer" (click)="scrollToTop()">
        <div class="w-10 h-10 bg-gradient-primary rounded-lg flex items-center justify-center shadow-glow">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </div>
        <span class="text-xl font-bold text-gradient">CurriculosPro IA</span>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a (click)="scrollTo('features')" class="text-gray-700 hover:text-primary-600 cursor-pointer font-medium">Recursos</a>
        <a (click)="scrollTo('pricing')" class="text-gray-700 hover:text-primary-600 cursor-pointer font-medium">Preços</a>
        <a (click)="scrollTo('testimonials')" class="text-gray-700 hover:text-primary-600 cursor-pointer font-medium">Depoimentos</a>
        <a href="http://localhost:4200" class="text-gray-700 hover:text-primary-600 font-medium">Entrar</a>
        <a href="http://localhost:4200" class="bg-gradient-primary text-white px-6 py-2 rounded-full font-semibold hover:shadow-glow transition-all">
          Começar Grátis
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
        <svg *ngIf="!mobileMenuOpen" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg *ngIf="mobileMenuOpen" class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="mobileMenuOpen" class="md:hidden bg-white border-t border-gray-200 animate-slide-down">
    <div class="px-4 py-4 space-y-3">
      <a (click)="scrollTo('features')" class="block py-2 text-gray-700 hover:text-primary-600 cursor-pointer font-medium">Recursos</a>
      <a (click)="scrollTo('pricing')" class="block py-2 text-gray-700 hover:text-primary-600 cursor-pointer font-medium">Preços</a>
      <a (click)="scrollTo('testimonials')" class="block py-2 text-gray-700 hover:text-primary-600 cursor-pointer font-medium">Depoimentos</a>
      <a href="http://localhost:4200" class="text-gray-700 hover:text-primary-600 font-medium">Entrar</a>
      <a href="http://localhost:4200" class="block text-center bg-gradient-primary text-white px-6 py-3 rounded-full font-semibold">
        Começar Grátis
      </a>
    </div>
