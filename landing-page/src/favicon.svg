<!-- SVG Favicon para CurriculosPro IA -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  
  <!-- Document icon -->
  <path d="M30 25 L55 25 L70 40 L70 75 L30 75 Z" fill="white" opacity="0.95"/>
  <path d="M55 25 L55 40 L70 40" fill="none" stroke="white" stroke-width="2" opacity="0.95"/>
  
  <!-- Lines representing text -->
  <line x1="38" y1="45" x2="62" y2="45" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="52" x2="62" y2="52" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="59" x2="55" y2="59" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- AI Sparkle -->
  <circle cx="65" cy="65" r="8" fill="#fbbf24"/>
  <path d="M65 60 L65 70 M60 65 L70 65" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
