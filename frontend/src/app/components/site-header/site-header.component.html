<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="w-full px-4 sm:px-6 lg:px-12 py-4">
    <div class="flex justify-between items-center w-full">
      <div class="flex items-center gap-4">
        <a routerLink="/" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
          <mat-icon class="text-indigo-600">description</mat-icon>
          <span class="text-xl font-bold text-gray-800">CurriculosPro IA</span>
        </a>
        <a
          *ngIf="isAdmin"
          routerLink="/admin"
          routerLinkActive="bg-indigo-100 border-indigo-400 text-indigo-700"
          class="px-4 py-2 text-sm font-semibold text-indigo-600 bg-indigo-50 border border-indigo-200 rounded-lg hover:bg-indigo-100 hover:border-indigo-300 transition-all duration-200 shadow-sm hover:shadow-md flex items-center gap-2"
        >
          <mat-icon class="text-lg">dashboard</mat-icon>
          <span>Painel Admin</span>
        </a>
      </div>

      <div class="flex items-center gap-3 flex-shrink-0">
        <div *ngIf="isAuthenticated" class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <p class="text-sm font-semibold text-gray-800">
              {{ currentUser?.name || currentUser?.email }}
            </p>
            <p class="text-xs text-gray-500 flex items-center gap-1 justify-end">
              <mat-icon class="text-xs">stars</mat-icon>
              <span>{{ userCredits }} crédito(s)</span>
            </p>
          </div>
          <div class="relative">
            <button
              type="button"
              [matMenuTriggerFor]="userMenu"
              class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-lg hover:from-indigo-100 hover:to-purple-100 transition-all duration-200 shadow-sm hover:shadow-md"
            >
              <mat-icon class="text-indigo-600">account_circle</mat-icon>
              <span class="text-sm font-medium text-gray-700 hidden md:inline">Painel do usuário</span>
              <mat-icon class="text-gray-500 text-sm">arrow_drop_down</mat-icon>
            </button>
            <mat-menu #userMenu="matMenu" class="mt-2">
              <div class="p-2">
                <div class="px-3 py-2 border-b border-gray-200 mb-2">
                  <p class="text-sm font-semibold text-gray-800">{{ getUserDisplayName() }}</p>
                  <p class="text-xs text-gray-500">{{ userCredits }} crédito(s) disponível(is)</p>
                </div>
                <button
                  mat-menu-item
                  routerLink="/"
                  class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded transition-colors duration-150 flex items-center gap-2"
                >
                  <mat-icon class="text-lg">home</mat-icon>
                  <span>Início</span>
                </button>
                <button
                  mat-menu-item
                  routerLink="/historico-analises"
                  class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded transition-colors duration-150 flex items-center gap-2"
                >
                  <mat-icon class="text-lg">history</mat-icon>
                  <span>Histórico de Análises</span>
                </button>
                <button
                  mat-menu-item
                  routerLink="/financeiro"
                  class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded transition-colors duration-150 flex items-center gap-2"
                >
                  <mat-icon class="text-lg">account_balance</mat-icon>
                  <span>Menu Financeiro</span>
                </button>
                <button
                  mat-menu-item
                  routerLink="/meus-dados"
                  class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded transition-colors duration-150 flex items-center gap-2"
                >
                  <mat-icon class="text-lg">person</mat-icon>
                  <span>Meus Dados</span>
                </button>
                <button
                  mat-menu-item
                  routerLink="/trocar-senha"
                  class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded transition-colors duration-150 flex items-center gap-2"
                >
                  <mat-icon class="text-lg">lock</mat-icon>
                  <span>Trocar Senha</span>
                </button>
                <button
                  mat-menu-item
                  (click)="logout()"
                  class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded transition-colors duration-150 flex items-center gap-2"
                >
                  <mat-icon class="text-lg">logout</mat-icon>
                  <span>Sair</span>
                </button>
              </div>
            </mat-menu>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
